plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hapistavla.oyun'
    compileSdk 35

    defaultConfig {
        applicationId "com.hapistavla.oyun"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Google AdMob (Google Mobile Ads SDK)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
